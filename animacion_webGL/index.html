<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>UMSA Digital - Animación 3D Interactiva</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        body { margin: 0; padding: 0; background: #1a202c; font-family: 'Inter', sans-serif; }
        #unity-container { position: absolute; width: 100%; height: 100%; }
        #unity-canvas { width: 100%; height: 100%; background: #1a202c; }
        #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
        #unity-logo { width: 154px; height: 130px; background: url('TemplateData/unity-logo-dark.png') no-repeat center; margin: 0 auto 20px; }
        #unity-progress-bar-empty { width: 141px; height: 18px; margin: 0 auto 10px; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; }
        #unity-progress-bar-full { width: 0%; height: 18px; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; }
        #unity-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center; }
        .unity-footer-text { color: white; font-size: 12px; }
        .btn-volver { background: #c9a227; color: #1a365d; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: 600; font-size: 13px; }
        .btn-volver:hover { background: #d4af37; }
        #unity-warning { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fefcbf; padding: 10px 20px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <p style="color: white; font-size: 14px;">Cargando experiencia 3D...</p>
        </div>
        <div id="unity-warning"></div>
    </div>

    <div id="unity-footer">
        <span class="unity-footer-text">🏛️ UMSA Digital - Experiencia Interactiva Unity WebGL</span>
        <a href="/" class="btn-volver">← Volver al Sistema</a>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/test_server.loader.js";
        var config = {
            dataUrl: buildUrl + "/test_server.data",
            frameworkUrl: buildUrl + "/test_server.framework.js",
            codeUrl: buildUrl + "/test_server.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "UMSA",
            productName: "UMSA Digital 3D",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
